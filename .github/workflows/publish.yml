# Publish the Python package to PyPI and the MCP launcher to npm on every
# published release, with no stored tokens: both registries trust this workflow
# file through GitHub's OIDC token (a PyPI "trusted publisher" with environment
# `pypi`, and npm "trusted publishing" for publish.yml). A version that is already
# on a registry is skipped there, so re-running a release is safe. The container
# image is published by docker-publish.yml from the same release event.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5        # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5
        with:
          python-version: "3.14"
      - name: pyproject, npm/package.json and the release tag agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          js=$(python -c "import json; print(json.load(open('npm/package.json'))['version'])")
          echo "pyproject=$py npm=$js tag=${TAG:-<manual run>}"
          test "$py" = "$js"
          if [ -n "$TAG" ]; then test "v$py" = "$TAG"; fi
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5        # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1      # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
                   process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || npm install -g npm@11
          npm --version
      - name: Publish unless this version is already on npm
        run: |
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$v" version 2>/dev/null)" ]; then
            echo "$name@$v is already on npm; skipping"
          else
            npm publish --access public
          fi
